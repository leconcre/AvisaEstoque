services:
  postgres:
    image: postgres:16-alpine
    container_name: avisa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avisa
      POSTGRES_PASSWORD: avisa
      POSTGRES_DB: avisaestoque
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avisa -d avisaestoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avisa-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DATABASE_URL: "postgresql://avisa:avisa@postgres:5432/avisaestoque?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-troque-em-producao-min-32-chars}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: "${CRON_SECRET:-dev-cron-secret}"
      CRON_ENABLED: "${CRON_ENABLED:-false}"
      WHATSAPP_PROVIDER: "${WHATSAPP_PROVIDER:-mock}"
      EVOLUTION_API_URL: "${EVOLUTION_API_URL:-}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-}"
      EVOLUTION_INSTANCE: "${EVOLUTION_INSTANCE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
